name: E87N Kernel Only

on:
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4
        with:
          path: build

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev \
            file wget qemu-utils libelf-dev jq ccache

      - name: Clone iStoreOS 24.10 source
        run: |
          cd build
          git clone -b istoreos-24.10 --depth 1 https://github.com/istoreos/istoreos.git istoreos
          cd istoreos
          printf 'src-git nas https://github.com/linkease/nas-packages.git;linkeasefull\nsrc-git nas_luci https://github.com/linkease/nas-packages-luci.git;main\n' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: build/istoreos/dl
          key: ${{ runner.os }}-dl-${{ hashFiles('build/e87n.config') }}
          restore-keys: |
            ${{ runner.os }}-dl-

      - name: Cache OpenWrt toolchain
        uses: actions/cache@v4
        with:
          path: |
            build/istoreos/staging_dir/toolchain-*
            build/istoreos/build_dir/toolchain-*
          key: ${{ runner.os }}-toolchain-${{ hashFiles('build/e87n.config') }}
          restore-keys: |
            ${{ runner.os }}-toolchain-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: build/istoreos/.ccache
          key: ${{ runner.os }}-ccache-v1
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Apply E87N patches
        run: bash build/apply.sh

      - name: Configure target
        run: |
          cd build/istoreos
          cp ../e87n.config .config
          make defconfig
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_edgepi_e87n=y' .config

      - name: Compile kernel and image FIT
        run: |
          set -o pipefail
          cd build/istoreos
          make CCACHE=y -j2 target/linux/compile V=s 2>&1 | tee /tmp/kernel-build.log
          make CCACHE=y -j2 target/linux/install V=s 2>&1 | tee -a /tmp/kernel-build.log

      - name: Upload kernel build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e87n-kernel-only-log
          path: /tmp/kernel-build.log
          retention-days: 7

      - name: Verify kernel output
        run: |
          cd build/istoreos
          find build_dir bin -type f \( -name '*edgepi_e87n*kernel*.bin' -o -name '*.itb' \) -ls 2>/dev/null || true
          test -n "$(find build_dir -type f -name '*edgepi_e87n*kernel*.bin' -o -name '*edgepi_e87n*.itb' | head -1)"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e87n-kernel-only
          path: |
            build/istoreos/build_dir/**/edgepi_e87n-kernel.bin
            build/istoreos/build_dir/**/istoreos-mediatek-filogic-edgepi_e87n-initramfs-kernel.bin
            build/istoreos/bin/targets/mediatek/filogic/*edgepi_e87n*.bin
            /tmp/kernel-build.log
          if-no-files-found: warn
          retention-days: 7
