name: E87N Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4
        with:
          path: build

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev \
            file wget qemu-utils libelf-dev jq
          sudo apt-get clean
          echo "=== disk after deps ==="
          df -h

      - name: Clone iStoreOS 24.10 source
        run: |
          cd build
          git clone -b istoreos-24.10 --depth 1 https://github.com/istoreos/istoreos.git istoreos
          cd istoreos
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply E87N + MT7987 support
        run: bash build/apply.sh

      - name: Configure target (EdgePi E87N)
        run: |
          cd build/istoreos
          cp ../e87n.config .config
          make defconfig
          echo "=== device symbols after defconfig ==="
          grep -E '^CONFIG_TARGET_mediatek_filogic_DEVICE_' .config || true
          echo "=== E87N device check ==="
          if grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_edgepi_e87n=y' .config; then
            echo "E87N DEVICE ENABLED"
          else
            echo "FATAL: edgepi_e87n device NOT enabled after defconfig"
            echo "check apply.sh: filogic.mk TARGET_DEVICES += edgepi_e87n and dts files"
            exit 1
          fi

      - name: Show selected packages
        run: |
          cd build/istoreos
          grep -E '^CONFIG_PACKAGE_luci-app-' .config | sort

      - name: Prepare kernel (apply MT7987 patches via quilt)
        run: |
          cd build/istoreos
          make target/linux/prepare V=s 2>&1 | tee /tmp/kernel-prepare.log
          echo "=== quilt log tail ==="
          find build_dir -name "quilt.log" -exec tail -n 40 {} \; 2>/dev/null || true
          if grep -qE "Patch .* does not apply|Failed to apply|quilt.*ERROR|Error:" /tmp/kernel-prepare.log; then
            echo "FATAL: kernel patch application failed"
            exit 1
          fi
          echo "KERNEL PREPARE OK"

      - name: Build firmware
        run: |
          set -o pipefail
          cd build/istoreos
          echo "=== disk before build ==="
          df -h
          # Cap parallelism: full -j$(nproc) on the low-memory GitHub runner
          # tends to OOM / run out of disk mid-build (run5/run6 failed here
          # even though the sources were identical to the successful run4).
          make -j2 V=s 2>&1 | tee /tmp/build.log
          echo "=== disk after build ==="
          df -h

      - name: Extract build errors (always)
        if: always()
        run: |
          echo "=== disk usage ==="
          df -h || true
          du -sh build/istoreos/dl build/istoreos/build_dir build/istoreos/staging_dir 2>/dev/null || true
          if [ -f /tmp/build.log ]; then
            echo "=== last 40 lines of build.log ==="
            tail -n 40 /tmp/build.log || true
            echo "=== matched error lines in build.log ==="
            grep -nEi "no space left|error:|error [0-9]+|fatal|recipe for target|make\[[0-9]+\][^:]*:(error|no rule)|unable to|failed to|killed|out of memory|signal [0-9]" /tmp/build.log | tail -n 120 || true
            grep -nEi "no space left|error:|error [0-9]+|fatal|recipe for target|killed|out of memory" /tmp/build.log | tail -n 120 > /tmp/build-errors.txt || true
          else
            echo "no /tmp/build.log (make may have failed before writing log)"
          fi
          if [ -f /tmp/kernel-prepare.log ]; then
            echo "=== kernel-prepare.log tail ==="
            tail -n 20 /tmp/kernel-prepare.log || true
          fi

      - name: Verify firmware output
        run: |
          cd build/istoreos
          echo "=== filogic dir ==="
          ls -la bin/targets/mediatek/filogic/ 2>/dev/null || echo "NO filogic dir"
          echo "=== find e87n/sysupgrade ==="
          find bin/targets -iname "*e87n*" -ls 2>/dev/null || true
          find bin/targets -iname "*sysupgrade*" -ls 2>/dev/null || true
          if ls bin/targets/mediatek/filogic/*e87n*sysupgrade*.bin >/dev/null 2>&1; then
            echo "FIRMWARE OK"
          else
            echo "FATAL: no E87N sysupgrade image produced"
            exit 1
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e87n-istoreos-firmware
          path: |
            build/istoreos/bin/targets/mediatek/filogic/*.bin
            build/istoreos/bin/targets/mediatek/filogic/*.itb
            build/istoreos/bin/targets/mediatek/filogic/*sysupgrade*
            build/istoreos/bin/targets/mediatek/filogic/packages
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            /tmp/build.log
            /tmp/build-errors.txt
            /tmp/kernel-prepare.log
            build/istoreos/logs/
            build/istoreos/build_dir/target-*/linux-*/quilt.log
          retention-days: 7
