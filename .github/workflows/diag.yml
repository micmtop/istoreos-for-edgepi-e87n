name: E87N Config Diag

# 只做「feeds + defconfig」，不编译任何东西（约 5-8 分钟）。
# 用途：查某个包为什么没进固件（依赖被静默丢弃时 defconfig 不会报错）。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'iStoreOS 分支'
        type: string
        default: 'istoreos-25.12'

jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: build

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gawk gettext libncurses-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev file wget git

      - name: Clone iStoreOS
        run: |
          cd build
          rm -rf istoreos
          git clone -b ${{ inputs.branch }} --depth 1 https://github.com/istoreos/istoreos.git istoreos
          cd istoreos
          printf 'src-git nas https://github.com/linkease/nas-packages.git;linkeasefull\nsrc-git nas_luci https://github.com/linkease/nas-packages-luci.git;main\n' >> feeds.conf.default
          ./scripts/feeds update -a > /tmp/feeds-update.log 2>&1
          ./scripts/feeds install -a > /tmp/feeds-install.log 2>&1
          tail -5 /tmp/feeds-install.log

      - name: defconfig #1 (as-is)
        run: |
          cd build
          bash apply.sh
          cd istoreos
          cp ../e87n.config .config
          make defconfig > /tmp/defconfig1.log 2>&1 || tail -20 /tmp/defconfig1.log
          echo "=== 直接依赖链的展开结果（.packageinfo）"
          for p in libuci-lua luci-lua-runtime luci-lib-taskd taskd luci-lib-xterm quickstart liblua; do
            echo "--- $p"
            awk -v pkg="$p" '$0 == "Package: " pkg {f=1} f{print} f && /^$/{exit}' tmp/.packageinfo | grep -E "^(Package|Depends|Provides|Menu|Conflicts):" 
          done

      - name: defconfig #2 (explicitly request the whole chain)
        run: |
          cd build/istoreos
          printf '%s\n' \
            CONFIG_PACKAGE_libuci-lua=y \
            CONFIG_PACKAGE_luci-lua-runtime=y \
            CONFIG_PACKAGE_taskd=y \
            CONFIG_PACKAGE_luci-lib-taskd=y \
            CONFIG_PACKAGE_luci-lib-xterm=y \
            CONFIG_PACKAGE_script-utils=y \
            CONFIG_PACKAGE_coreutils=y \
            CONFIG_PACKAGE_coreutils-stty=y \
            CONFIG_PACKAGE_luci-app-store=y \
            CONFIG_PACKAGE_luci-app-quickstart=y >> .config
          make defconfig > /tmp/defconfig2.log 2>&1 || tail -20 /tmp/defconfig2.log
          echo "=== 显式要求之后谁还活着"
          for s in luci-app-store luci-app-quickstart luci-lib-taskd luci-lib-xterm taskd \
                   libuci-lua luci-lua-runtime script-utils coreutils coreutils-stty; do
            printf '%-24s %s\n' "$s" "$(grep -E "^CONFIG_PACKAGE_${s}=" .config || echo 'STILL DROPPED')"
          done
          echo "=== defconfig 第二次的警告（store/quickstart/taskd）"
          grep -iE "store|quickstart|taskd|xterm|lua" /tmp/defconfig2.log | head -20

      - name: Why kconfig still drops them (generated Config.in stanza)
        run: |
          cd build/istoreos
          echo "=== 出现位置"
          grep -n "luci-app-store" tmp/.config-package.in | head -10
          echo "=== 全部相关段落"
          grep -n -B3 -A14 "PACKAGE_luci-app-store" tmp/.config-package.in | head -70
          echo "=== quickstart 段落"
          grep -n -A14 "^config PACKAGE_luci-app-quickstart" tmp/.config-package.in | head -30
          echo "=== 是否有别的包 depends on store"
          grep -rn "PACKAGE_luci-app-store" tmp/.config-package.in | grep -v "^.*config PACKAGE_luci-app-store" | head -10
