name: E87N Config Diag

# 只做「feeds + defconfig」，不编译任何东西（约 5-8 分钟）。
# 用途：查某个包为什么没进固件（依赖被静默丢弃时 defconfig 不会报错）。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'iStoreOS 分支'
        type: string
        default: 'istoreos-25.12'

jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: build

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gawk gettext libncurses-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev file wget git

      - name: Clone iStoreOS
        run: |
          cd build
          rm -rf istoreos
          git clone -b ${{ inputs.branch }} --depth 1 https://github.com/istoreos/istoreos.git istoreos
          cd istoreos
          printf 'src-git nas https://github.com/linkease/nas-packages.git;linkeasefull\nsrc-git nas_luci https://github.com/linkease/nas-packages-luci.git;main\n' >> feeds.conf.default
          ./scripts/feeds update -a > /tmp/feeds-update.log 2>&1
          ./scripts/feeds install -a > /tmp/feeds-install.log 2>&1
          tail -5 /tmp/feeds-install.log

      - name: Apply E87N + defconfig + evaluate dependency symbols
        run: |
          cd build
          bash apply.sh
          cd istoreos
          cp ../e87n.config .config
          make defconfig > /tmp/defconfig.log 2>&1 || tail -20 /tmp/defconfig.log

          echo "=== 选中情况"
          for s in luci-app-store luci-app-quickstart quickstart; do
            printf '%-24s %s\n' "$s" "$(grep -E "^CONFIG_PACKAGE_${s}=" .config || echo 'NOT SET')"
          done

          for pkg in luci-app-store luci-app-quickstart; do
            START=$(grep -n "config PACKAGE_${pkg}$" tmp/.config-package.in | head -1 | cut -d: -f1)
            echo "=== stanza line $START for $pkg"
            if [ -n "$START" ]; then
              sed -n "${START},$((START + 22))p" tmp/.config-package.in
              echo "--- 每个 depends on 里的符号在当前 .config 的取值"
              sed -n "${START},$((START + 22))p" tmp/.config-package.in \
                | grep "depends on" \
                | tr ' ()!&|<>=+' '\n\n\n\n\n\n\n\n\n\n\n' > /tmp/syms.txt
              sort -u /tmp/syms.txt | while read -r sym; do
                  [ -n "$sym" ] || continue
                  case "$sym" in
                    depends|on|if) continue ;;
                  esac
                  val=$(grep -E "^CONFIG_${sym}=" .config | head -1)
                  printf '   %-42s %s\n' "$sym" "${val:-<NOT SET>}"
                done
            fi
          done
