# E87N 网络性能参数
#
# 只放"开机早期就能应用、且与硬件无关"的项（net.core / net.ipv4）。
# netfilter 相关的（conntrack 上限、超时、acct）依赖内核模块已加载，
# 写在这里会被 sysctl 服务在模块加载前静默跳过，所以不放。
#
# 说明：
#   netdev_max_backlog      突发流量时内核收包队列。默认 1000 在千兆跑满时会丢包。
#   tcp_fastopen=3          服务端+客户端都启用 TFO，省一个 RTT。
#   tcp_slow_start_after_idle=0
#                           长连接空闲后不再退回慢启动。NAS 场景很关键：
#                           否则拷贝间隔一会儿速度就要重新爬坡。
#   tcp_mtu_probing=1       PMTU 黑洞时自动探测，PPPoE(1492) 下更稳。

net.core.netdev_max_backlog = 3000
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
