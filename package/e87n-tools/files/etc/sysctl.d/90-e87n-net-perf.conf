# E87N 网络参数
#
# 重要前提：这些参数只影响**路由器自己**发起的 TCP 连接（装包、DDNS、NTP、
# 在路由器上跑测速）。经过路由器转发的流量不受影响 —— 客户端和服务器各自
# 决定拥塞控制、窗口大小，路由器只负责搬包。
#
# 所以想让"客户端下载更快"，调这里的 TCP 参数没有任何效果。
# 转发性能取决于：硬件卸载(HNAT/PPE)、flowtable、MSS 钳制、网卡卸载特性。
#
# 真正对转发有意义的只有一项：
#   netdev_max_backlog   内核收包队列长度。默认 1000 在千兆跑满时会因突发丢包。
#
# 其余是提升路由器本机连接体验的：
#   tcp_fastopen=3       服务端+客户端都启用 TFO，省一个 RTT
#   tcp_slow_start_after_idle=0
#                        本机长连接空闲后不退回慢启动
#   tcp_mtu_probing=1    PPPoE(1492) 下遇到 PMTU 黑洞自动降级探测

net.core.netdev_max_backlog = 3000
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
